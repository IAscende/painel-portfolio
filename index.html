<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel do Portfólio</title>
<style>
:root{--bg:#fbfbfa;--card:#fff;--tx:#1a1a18;--dim:#6b6b66;--line:#e4e4e0;
--ativo:#1a7f5a;--dormente:#8a6d3b;--congelado:#3b6d8a;--arquivado:#6b6b66;
--concluido:#4a5a6b;--alerta:#a3341f;--alerta-bg:#fdf2ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#131412;--card:#1c1e1b;--tx:#e8e8e4;--dim:#9a9a94;--line:#2e302c;
--ativo:#5fd39b;--dormente:#d9b169;--congelado:#79b6d9;--arquivado:#9a9a94;
--concluido:#8fa3b8;--alerta:#ff8f74;--alerta-bg:#2c1c17}}
:root[data-theme="dark"]{--bg:#131412;--card:#1c1e1b;--tx:#e8e8e4;--dim:#9a9a94;
--line:#2e302c;--ativo:#5fd39b;--dormente:#d9b169;--congelado:#79b6d9;
--arquivado:#9a9a94;--concluido:#8fa3b8;--alerta:#ff8f74;--alerta-bg:#2c1c17}
*{box-sizing:border-box}
body{margin:0;padding:2rem 1.25rem 4rem;background:var(--bg);color:var(--tx);
font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:940px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 .25rem}
.sub{color:var(--dim);font-size:.85rem;margin-bottom:2rem}
h2{font-size:1.05rem;margin:2.5rem 0 .9rem;padding-bottom:.4rem;
border-bottom:1px solid var(--line);display:flex;gap:.5rem;align-items:baseline}
h2 .n{color:var(--dim);font-weight:400;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--s);
border-radius:8px;padding:.9rem 1.1rem;margin-bottom:.7rem}
.card h3{margin:0 0 .35rem;font-size:1rem}
.meta{display:flex;flex-wrap:wrap;gap:.35rem .9rem;color:var(--dim);font-size:.8rem;
margin-bottom:.5rem}
.row{margin:.3rem 0;font-size:.88rem}
.row b{font-weight:600}
code{background:var(--bg);border:1px solid var(--line);border-radius:4px;
padding:.08rem .35rem;font-size:.82em;overflow-wrap:anywhere}
.alerta{background:var(--alerta-bg);color:var(--alerta);border-radius:6px;
padding:.45rem .65rem;font-size:.83rem;margin-top:.55rem}
.topo{background:var(--alerta-bg);border:1px solid var(--alerta);border-radius:10px;
padding:1rem 1.2rem;margin-bottom:1.5rem}
.topo h2{margin:0 0 .6rem;border:0;color:var(--alerta)}
.topo li{margin:.28rem 0;font-size:.88rem}
.topo ul{margin:0;padding-left:1.1rem}
a{color:inherit}
.card h3 a{text-decoration:none;border-bottom:1px solid transparent}
.card h3 a:hover{border-bottom-color:var(--s)}
.meta a{color:var(--s);font-weight:600}
.barra{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.5rem}
#q{flex:1 1 260px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:7px;
background:var(--card);color:var(--tx);font:inherit;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--card);color:var(--dim);
border-radius:999px;padding:.32rem .75rem;font:inherit;font-size:.8rem;cursor:pointer}
.chip:hover{color:var(--tx)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cp{margin-left:.45rem;border:1px solid var(--line);background:transparent;
color:var(--dim);border-radius:5px;padding:.1rem .45rem;font:inherit;font-size:.75rem;
cursor:pointer}
.cp:hover{color:var(--tx)}
.cp.ok{color:var(--ativo);border-color:var(--ativo)}
.abrir{margin-left:.5rem;font-size:.8rem;color:var(--s);font-weight:600;
text-decoration:none}
[hidden]{display:none!important}

.login{max-width:380px;margin:14vh auto;text-align:center}
.login h1{font-size:1.35rem;margin-bottom:.4rem}
.login p{color:var(--dim);font-size:.88rem;margin-bottom:1.5rem}
.login input{width:100%;padding:.7rem .8rem;border:1px solid var(--line);
border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:.7rem}
.login button{width:100%;padding:.7rem;border:0;border-radius:8px;
background:var(--tx);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
.login button:disabled{opacity:.5;cursor:default}
.aviso{margin-top:1rem;font-size:.85rem;color:var(--dim)}
.sair{position:fixed;top:1rem;right:1rem;font-size:.78rem;color:var(--dim);
background:var(--card);border:1px solid var(--line);border-radius:999px;
padding:.3rem .8rem;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="login" id="login" hidden>
    <h1>Painel do Portfólio</h1>
    <p>Digite seu email. Você recebe um link e entra sem senha.</p>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    <button id="entrar">Enviar link</button>
    <div class="aviso" id="aviso"></div>
  </div>
  <div class="wrap" id="painel" hidden></div>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient('https://bbpvxlnctheiswrgntgj.supabase.co', 'sb_publishable_Yoj8xRGyKySmzYmZ4Xm1_A_yq1Y4XdV');
const $ = id => document.getElementById(id);
const ROTULO = {ativo:'Ativo',dormente:'Dormente',congelado:'Congelado',
                arquivado:'Arquivado',concluido:'Concluído'};
const ORDEM = ['ativo','dormente','congelado','arquivado','concluido'];
const esc = s => String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('entrar').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) return;
  $('entrar').disabled = true;
  const { error } = await sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.href.split('#')[0] } });
  $('aviso').textContent = error ? 'Erro: ' + error.message
    : 'Link enviado. Confira seu email — pode levar um minuto.';
  $('entrar').disabled = false;
};

async function render() {
  const { data, error } = await sb.from('iniciativas').select('*')
    .order('status').order('git_dias', { nullsFirst: false });
  const p = $('painel');
  if (error) { p.innerHTML = '<p>Erro ao carregar: ' + esc(error.message) + '</p>'; return; }
  if (!data.length) {
    p.innerHTML = '<h1>Painel do Portfólio</h1><p class="sub">Nenhuma iniciativa '
      + 'para esta conta. Rode <code>publicar_painel.py --dados</code> na máquina '
      + 'onde o vault vive.</p>'; return;
  }
  const alertados = data.filter(i => i.alertas?.length);
  let h = '<button class="sair" id="sair">sair</button><h1>Painel do Portfólio</h1>'
    + '<div class="sub">' + data.length + ' iniciativas · dados do vault Aruk</div>';
  if (alertados.length) {
    h += '<div class="topo"><h2>⚠️ Precisam de atenção (' + alertados.length + ')</h2><ul>'
      + alertados.map(i => '<li><b>' + esc(i.title) + '</b> — '
        + esc(i.alertas.join('; ')) + '</li>').join('') + '</ul></div>';
  }
  for (const st of ORDEM) {
    const grupo = data.filter(i => i.status === st);
    if (!grupo.length) continue;
    h += '<h2>' + ROTULO[st] + ' <span class="n">' + grupo.length + '</span></h2>';
    for (const i of grupo) {
      h += '<div class="card" style="--s:var(--' + st + ')">';
      h += '<h3><a href="' + esc(i.obsidian_uri) + '">' + esc(i.title) + '</a></h3>';
      const meta = ['<code>' + esc(i.id) + '</code>'];
      if (i.git_branch) {
        const b = i.git_remote ? '<a href="' + esc(i.git_remote) + '" target="_blank" '
          + 'rel="noopener">' + esc(i.git_branch) + '</a>' : '<b>' + esc(i.git_branch) + '</b>';
        meta.push('git: ' + b + ' · ' + esc(i.git_data) + ' (' + i.git_dias + 'd)');
      }
      if (i.fonte_verdade === 'pc-trabalho') meta.push('fonte: PC do trabalho');
      h += '<div class="meta">' + meta.join(' · ') + '</div>';
      if (i.proximo_passo) h += '<div class="row"><b>Próximo passo:</b> ' + esc(i.proximo_passo) + '</div>';
      if (i.motivo_parada) h += '<div class="row"><b>Por que parou:</b> ' + esc(i.motivo_parada) + '</div>';
      if (i.gate) h += '<div class="row"><b>Gate:</b> ' + esc(i.gate) + '</div>';
      if (i.rodar) h += '<div class="row"><b>Rodar:</b> <code>' + esc(i.rodar) + '</code>'
        + '<button class="cp" data-cmd="' + esc(i.rodar) + '">copiar</button>'
        + (i.url ? ' <a class="abrir" href="' + esc(i.url) + '">abrir →</a>' : '') + '</div>';
      if (i.alertas?.length) h += '<div class="alerta">⚠️ ' + esc(i.alertas.join('; ')) + '</div>';
      h += '</div>';
    }
  }
  p.innerHTML = h;
  $('sair').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  p.querySelectorAll('.cp').forEach(b => b.onclick = () =>
    navigator.clipboard.writeText(b.dataset.cmd).then(() => {
      b.textContent = 'copiado'; setTimeout(() => b.textContent = 'copiar', 1200); }));
}

async function estado() {
  const { data: { session } } = await sb.auth.getSession();
  $('login').hidden = !!session;
  $('painel').hidden = !session;
  if (session) render();
}
sb.auth.onAuthStateChange(() => estado());
estado();
</script>
</body>
</html>
